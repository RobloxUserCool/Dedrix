<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101216">
<title>Dedrix</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    color-scheme: dark;
    --bg: #101216;
    --panel: #171a20;
    --line: #292d35;
    --text: #d5d8df;
    --muted: #858b96;
    --green: #a3c9a5;
    --blue: #91b9dc;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Roboto", "Arial", sans-serif;
}

body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

header {
    height: 43px;
    min-height: 43px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 13px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
}

.brand {
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 1.8px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 13px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .5px;
}

.status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
}

.toolbar {
    min-height: 39px;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    background: #13161b;
    border-bottom: 1px solid var(--line);
}

.tool {
    border: 0;
    background: transparent;
    color: #aeb4bf;
    padding: 7px 10px;
    font-size: 11px;
    letter-spacing: .7px;
    font-family: inherit;
}

.tool:active {
    background: #292e37;
}

.tool.active {
    color: var(--green);
}

main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
}

.terminal {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 13px 12px 8px;
    font-family: "Roboto Mono", "Courier New", monospace;
    font-size: 13px;
    line-height: 1.65;
    letter-spacing: .15px;
    overflow-wrap: anywhere;
}

.line {
    white-space: pre-wrap;
    min-height: 21px;
}

.prompt {
    color: var(--green);
}

.command {
    color: #e0e3e9;
}

.output {
    color: #c1c6cf;
}

.muted {
    color: var(--muted);
}

.error {
    color: #d98c8c;
}

.editor-panel {
    display: none;
    flex-direction: column;
    height: 43%;
    min-height: 150px;
    border-top: 1px solid var(--line);
    background: #111419;
}

.editor-panel.visible {
    display: flex;
}

.editor-head {
    height: 34px;
    min-height: 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 11px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .7px;
    border-bottom: 1px solid var(--line);
}

.editor {
    flex: 1;
    width: 100%;
    min-height: 0;
    resize: none;
    border: 0;
    outline: none;
    padding: 11px;
    background: #111419;
    color: #d5dce6;
    font-family: "Roboto Mono", "Courier New", monospace;
    font-size: 13px;
    line-height: 1.6;
    tab-size: 4;
}

.input-area {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    background: #171a20;
    border-top: 1px solid var(--line);
}

.input-prompt {
    color: var(--green);
    font-family: monospace;
    font-size: 14px;
    white-space: nowrap;
}

#commandInput {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: #e0e3e9;
    font-family: "Roboto Mono", "Courier New", monospace;
    font-size: 14px;
    padding: 5px 0;
    caret-color: var(--green);
}

#commandInput::placeholder {
    color: #656c78;
}

.send {
    border: 0;
    background: transparent;
    color: var(--green);
    font-size: 17px;
    padding: 5px 8px;
}

.keyboard-row {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 5px 7px;
    background: #171a20;
    border-top: 1px solid var(--line);
}

.key {
    flex: 0 0 auto;
    min-width: 34px;
    height: 29px;
    border: 1px solid #343943;
    border-radius: 4px;
    background: #20242b;
    color: #b8bec8;
    font-family: monospace;
    font-size: 11px;
}

.key:active {
    background: #343b46;
}

@media (max-height: 500px) {
    .editor-panel {
        height: 35%;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">DEDRIX</div>
    <div class="header-right">
        <span>TERMINAL</span>
        <span class="status-dot"></span>
    </div>
</header>

<div class="toolbar">
    <button class="tool active" id="terminalButton" onclick="showTerminal()">TERMINAL</button>
    <button class="tool" id="editorButton" onclick="toggleEditor()">EDITOR</button>
    <button class="tool" onclick="runEditor()">RUN</button>
    <button class="tool" onclick="clearTerminal()">CLEAR</button>
</div>

<main>
    <div class="terminal" id="terminal"></div>

    <section class="editor-panel" id="editorPanel">
        <div class="editor-head">
            <span>main.dedrix</span>
            <span>EDITOR</span>
        </div>
        <textarea
            class="editor"
            id="code"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
            placeholder="Код Dedrix..."
        ></textarea>
    </section>
</main>

<div class="input-area">
    <span class="input-prompt">~ $</span>
    <input
        id="commandInput"
        type="text"
        placeholder="Введите команду"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
    >
    <button class="send" onclick="submitCommand()">↵</button>
</div>

<div class="keyboard-row">
    <button class="key" onclick="insertKey('ESC')">ESC</button>
    <button class="key" onclick="insertKey('TAB')">TAB</button>
    <button class="key" onclick="insertKey('CTRL')">CTRL</button>
    <button class="key" onclick="insertKey('ALT')">ALT</button>
    <button class="key" onclick="insertKey('↑')">↑</button>
    <button class="key" onclick="insertKey('↓')">↓</button>
    <button class="key" onclick="insertKey('←')">←</button>
    <button class="key" onclick="insertKey('→')">→</button>
    <button class="key" onclick="insertKey('/')">/</button>
    <button class="key" onclick="insertKey('-')">-</button>
</div>

<script>
const terminal = document.getElementById("terminal");
const commandInput = document.getElementById("commandInput");
const editorPanel = document.getElementById("editorPanel");
const editor = document.getElementById("code");

let history = [];
let historyIndex = 0;

function addLine(text, type = "output") {
    const line = document.createElement("div");
    line.className = "line " + type;
    line.textContent = text;
    terminal.appendChild(line);
    terminal.scrollTop = terminal.scrollHeight;
}

function addCommand(text) {
    const line = document.createElement("div");
    line.className = "line";
    
    const prompt = document.createElement("span");
    prompt.className = "prompt";
    prompt.textContent = "~ $ ";

    const command = document.createElement("span");
    command.className = "command";
    command.textContent = text;

    line.append(prompt, command);
    terminal.appendChild(line);
}

function submitCommand() {
    const value = commandInput.value.trim();
    if (!value) return;

    addCommand(value);
    history.push(value);
    historyIndex = history.length;
    commandInput.value = "";

    executeCommand(value);
}

function executeCommand(command) {
    if (command === "clear") {
        clearTerminal();
        return;
    }

    if (command === "help") {
        addLine("Доступные команды:");
        addLine("help     — список команд");
        addLine("clear    — очистить терминал");
        addLine("version  — версия Dedrix");
        addLine("edit     — открыть редактор");
        addLine("run      — выполнить код из редактора");
        return;
    }

    if (command === "version") {
        addLine("Dedrix 0.1.0");
        return;
    }

    if (command === "edit") {
        toggleEditor(true);
        return;
    }

    if (command === "run") {
        runEditor();
        return;
    }

    const match = command.match(/^print\(["'](.*)["']\)$/);
    if (match) {
        addLine(match[1]);
        return;
    }

    addLine("Неизвестная команда: " + command, "error");
}

function clearTerminal() {
    terminal.innerHTML = "";
}

function showTerminal() {
    editorPanel.classList.remove("visible");
    document.getElementById("editorButton").classList.remove("active");
    document.getElementById("terminalButton").classList.add("active");
    commandInput.focus();
}

function toggleEditor(forceOpen = false) {
    const open = forceOpen || !editorPanel.classList.contains("visible");
    editorPanel.classList.toggle("visible", open);

    document.getElementById("editorButton").classList.toggle("active", open);
    document.getElementById("terminalButton").classList.toggle("active", !open);
}

function runEditor() {
    const source = editor.value;
    const lines = source.split("\n");

    addLine("Запуск main.dedrix", "muted");

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        const match = line.match(/^print\(["'](.*)["']\)$/);

        if (match) {
            addLine(match[1]);
        } else {
            addLine("Строка " + (i + 1) + ": неизвестная команда", "error");
        }
    }

    addLine("Выполнение завершено", "muted");
}

function insertKey(key) {
    commandInput.focus();

    if (key === "ESC") {
        commandInput.value = "";
        return;
    }

    if (key === "TAB") {
        commandInput.value += "    ";
        return;
    }

    if (["CTRL", "ALT"].includes(key)) return;

    const start = commandInput.selectionStart;
    const end = commandInput.selectionEnd;
    const value = commandInput.value;

    if (key === "←" || key === "→" || key === "↑" || key === "↓") {
        return;
    }

    commandInput.value = value.slice(0, start) + key + value.slice(end);
    commandInput.setSelectionRange(start + key.length, start + key.length);
}

commandInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        submitCommand();
    }

    if (event.key === "ArrowUp") {
        event.preventDefault();
        if (historyIndex > 0) {
            historyIndex--;
            commandInput.value = history[historyIndex];
        }
    }

    if (event.key === "ArrowDown") {
        event.preventDefault();
        if (historyIndex < history.length - 1) {
            historyIndex++;
            commandInput.value = history[historyIndex];
        } else {
            historyIndex = history.length;
            commandInput.value = "";
        }
    }

    if (event.key === "Tab") {
        event.preventDefault();
        const start = commandInput.selectionStart;
        commandInput.value =
            commandInput.value.slice(0, start) +
            "    " +
            commandInput.value.slice(commandInput.selectionEnd);
        commandInput.setSelectionRange(start + 4, start + 4);
    }
});

addLine("Dedrix terminal", "muted");
addLine(" ");
</script>

</body>
</html>
