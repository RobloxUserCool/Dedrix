<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<title>Dedrix Terminal</title>
<style>
* { box-sizing: border-box; }

:root {
    color-scheme: dark;
    --bg: #0e0f12;
    --panel: #15171c;
    --line: #23262e;
    --text: #d7dae0;
    --muted: #6d7380;
    --accent: #7aa2ff;
    --ok: #8fe3a4;
    --warn: #e8c46a;
    --error: #ff6b6b;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
}

html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-weight: 300;
}

body {
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
}

#terminal {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 6px;
    font-size: 14px;
    line-height: 1.5;
    -webkit-overflow-scrolling: touch;
}

.line { white-space: pre-wrap; overflow-wrap: anywhere; }
.line.input { color: var(--muted); }
.line.info { color: var(--accent); }
.line.prompt { color: var(--warn); }
.line.preview { color: var(--ok); }
.line.error { color: var(--error); }
.line.size1 { font-size: 26px; line-height: 1.3; margin: 6px 0; }
.line.size2 { font-size: 19px; line-height: 1.35; margin: 4px 0; }
.line.size3 { font-size: 15px; }

#prompt-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    background: var(--panel);
}

#prompt-row span { color: var(--accent); }

#input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font: inherit;
    font-size: 15px;
}

#editor {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    background: var(--bg);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}

#editor.open { display: flex; }

#editor-text {
    flex: 1;
    width: 100%;
    resize: none;
    background: var(--bg);
    color: var(--text);
    border: none;
    outline: none;
    padding: 16px;
    font: inherit;
    font-size: 14px;
    line-height: 1.5;
}

#editor-bar {
    display: flex;
    gap: 10px;
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    background: var(--panel);
}

#editor-bar button {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 16px;
    font: inherit;
    font-size: 14px;
}

#editor-bar button:active { background: var(--line); }
#editor-bar button:focus-visible, #input:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
#editor-run { border-color: var(--accent) !important; color: var(--accent) !important; }
</style>
</head>
<body>

<div id="terminal"></div>

<div id="prompt-row">
    <span>&gt;</span>
    <input id="input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Команда">
</div>

<div id="editor">
    <textarea id="editor-text" spellcheck="false" aria-label="Редактор Dedrix"></textarea>
    <div id="editor-bar">
        <button id="editor-run" type="button">Запустить</button>
        <button id="editor-close" type="button">Закрыть</button>
    </div>
</div>

<input id="file-input" type="file" multiple hidden>

<script src="app.js"></script>
</body>
</html>
